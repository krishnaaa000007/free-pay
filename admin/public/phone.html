<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Pay — Phone</title>
    <style>
      :root {
        --parchment: #f7efe3;
        --parchment-deep: #eee2ce;
        --surface: #fffbf4;
        --ink: #2b1d14;
        --ink-soft: #5a4634;
        --muted: #8b7461;
        --hairline: rgba(43, 29, 20, 0.08);
        --saffron: #e8891d;
        --saffron-deep: #c96f0f;
        --saffron-soft: #fbe3c6;
        --success: #3e7c4a;
        --success-soft: #dcebd9;
        --danger: #b5371f;
        --danger-soft: #f6d5cd;
        --info: #2f6b8a;
        --info-soft: #d6e6ee;
        --font-display: Georgia, 'Times New Roman', serif;
        --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
        --k: 1;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: radial-gradient(circle at 30% 0%, #fdf6ea 0%, var(--parchment) 45%, #e9dcc8 100%);
        color: var(--ink); font-family: var(--font-body);
      }
      body { display: flex; flex-direction: column; }

      header {
        flex: none; display: flex; align-items: center; gap: 12px;
        padding: 10px 18px;
        background: rgba(255, 251, 244, 0.92);
        border-bottom: 1px solid var(--hairline);
        backdrop-filter: blur(8px);
      }
      body.bare header { display: none; }

      .brand { display: flex; align-items: center; gap: 9px; }
      .brand-mark {
        width: 30px; height: 30px; border-radius: 9px;
        background: linear-gradient(135deg, #f2a044, #c96f0f);
        display: grid; place-items: center; color: #fff8ec; font-weight: 700; font-size: 15px;
      }
      .brand-name { font-family: var(--font-display); font-size: 17px; line-height: 1.1; }
      .brand-sub { font-size: 9.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); }
      .spacer { flex: 1; }
      .divider { width: 1px; height: 24px; background: var(--hairline); flex: none; }
      header > * { flex: none; }
      header, .group, .role, .who, .netpill, .peer, button { white-space: nowrap; }
      /* Shed the optional controls before anything is allowed to wrap. */
      @media (max-width: 1100px) { .who, #jumps, #jumps + .divider { display: none; } }
      @media (max-width: 820px) { .peer, #bare { display: none; } }

      .role {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 15px; border-radius: 999px; font-size: 13px; font-weight: 700;
      }
      .role.pilgrim { background: var(--info-soft); color: var(--info); }
      .role.vendor { background: var(--saffron-soft); color: var(--saffron-deep); }
      .who { font-size: 12.5px; color: var(--muted); }

      button {
        font: inherit; cursor: pointer;
        border-radius: 10px; border: 1px solid #d3bfa3;
        background: var(--surface); color: var(--ink);
        padding: 7px 12px; font-size: 12.5px; font-weight: 600;
        transition: transform .08s ease, background .15s ease;
      }
      button:hover { background: var(--parchment-deep); }
      button:active { transform: scale(0.97); }
      button.primary { background: linear-gradient(135deg, #f2a044, #c96f0f); border-color: transparent; color: #fff8ec; }
      button.danger { background: var(--danger); border-color: transparent; color: #fff; }
      button.ghost { border-color: transparent; background: transparent; color: var(--saffron-deep); }
      .group { display: flex; gap: 6px; align-items: center; }

      .netpill {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
        background: var(--success-soft); color: var(--success);
      }
      .netpill.offline { background: var(--danger-soft); color: var(--danger); }
      .netpill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
      .netpill.offline i { animation: blink 1.1s infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }

      .link { display: inline-flex; align-items: center; gap: 6px; }
      .peer { font-size: 12px; color: var(--muted); }
      .peer.live { color: var(--success); font-weight: 600; }

      /* ---------- the phone ---------- */
      main { flex: 1; display: grid; place-items: center; min-height: 0; padding: 10px; }
      /* Scaling is done with `zoom`, not `transform`. `zoom` participates in layout, so the
         phone still occupies its real on-screen size and centring works; a transform would
         leave an unscaled 844px box behind and push the phone off the bottom. It also keeps
         normal hit-testing inside the iframe. `transform` is the fallback for browsers
         without `zoom`, with the wrapper sized by hand to compensate. */
      .stageinner { transform-origin: top left; }

      .phone {
        position: relative;
        width: 407px; height: 844px;
        border-radius: 56px; padding: 14px;
        background: linear-gradient(155deg, #43301f, #1a110a 60%, #2a1c12);
        box-shadow:
          0 30px 70px rgba(48, 30, 12, 0.38),
          0 6px 18px rgba(48, 30, 12, 0.22),
          inset 0 0 0 2px rgba(255, 228, 190, 0.10),
          inset 0 0 0 7px rgba(0, 0, 0, 0.55);
      }
      /* dynamic island */
      .phone::after {
        content: '';
        position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
        width: 112px; height: 30px; border-radius: 16px;
        background: #0d0906; z-index: 4;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      }
      /* side buttons */
      .btn-side { position: absolute; border-radius: 2px; background: linear-gradient(90deg, #241810, #4b3823); }
      .btn-side.l1 { left: -3px; top: 150px; width: 3px; height: 32px; border-radius: 3px 0 0 3px; }
      .btn-side.l2 { left: -3px; top: 205px; width: 3px; height: 58px; border-radius: 3px 0 0 3px; }
      .btn-side.l3 { left: -3px; top: 278px; width: 3px; height: 58px; border-radius: 3px 0 0 3px; }
      .btn-side.r1 { right: -3px; top: 235px; width: 3px; height: 92px; border-radius: 0 3px 3px 0; }

      .screen {
        position: relative; width: 379px; height: 816px;
        border-radius: 44px; overflow: hidden; background: var(--parchment);
      }
      .screen iframe { width: 379px; height: 816px; border: 0; display: block; }
      /* home indicator */
      .screen::after {
        content: '';
        position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
        width: 138px; height: 5px; border-radius: 3px;
        background: rgba(43, 29, 20, 0.35); z-index: 3; pointer-events: none;
      }

      /* ---------- toast ---------- */
      .flash {
        position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(10px);
        background: var(--ink); color: var(--parchment);
        padding: 11px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.3);
        opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
        z-index: 50; display: flex; align-items: center; gap: 10px; white-space: nowrap;
      }
      .flash.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .flash b { color: #f6c98a; }

      .hint {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        max-width: 440px; text-align: center; background: var(--surface);
        border: 1px solid var(--hairline); border-radius: 18px; padding: 26px 30px;
        box-shadow: 0 20px 50px rgba(58, 36, 16, 0.2); z-index: 60;
      }
      .hint h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 8px; }
      .hint p { margin: 0 0 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.55; }
      .hint .group { justify-content: center; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark">F</div>
        <div>
          <div class="brand-name">Free Pay</div>
          <div class="brand-sub" id="brandsub">Demo</div>
        </div>
      </div>

      <div class="divider"></div>
      <span class="role" id="role">Phone</span>
      <span class="who" id="who"></span>

      <div class="spacer"></div>

      <div class="group" id="jumps"></div>
      <div class="divider"></div>
      <div class="group">
        <button id="net" class="danger">Cut the network</button>
        <span id="netstate" class="netpill"><i></i> Online</span>
      </div>
      <div class="divider"></div>
      <div class="group">
        <span class="peer" id="peer">waiting for the other phone…</span>
        <button id="reload" class="ghost">Reload</button>
        <button id="bare" class="ghost" title="Hide these controls (press H to bring them back)">Full screen</button>
      </div>
    </header>

    <main>
      <div class="stagewrap">
        <div class="stageinner"><div class="phone">
          <span class="btn-side l1"></span><span class="btn-side l2"></span>
          <span class="btn-side l3"></span><span class="btn-side r1"></span>
          <div class="screen"><iframe id="app" allow="camera; clipboard-read; clipboard-write; geolocation"></iframe></div>
        </div></div>
      </div>
    </main>

    <div id="flash" class="flash"></div>

    <script>
      /**
       * One phone, one window — so the pilgrim and the vendor can live on two different
       * screens and look like two different devices.
       *
       * Open it twice:
       *   /phone.html?role=pilgrim     -> loads the app from ORIGIN A
       *   /phone.html?role=vendor      -> loads the app from ORIGIN B
       *
       * The two origins matter: browser storage is per-origin, so the two windows hold
       * genuinely separate sessions, device keys and offline ledgers. Override either with
       * ?app=<origin> when the app is not on localhost (e.g. after deploying).
       *
       * Both windows are served from THIS origin, so they talk over a BroadcastChannel:
       * the QR string one phone displays is handed to the other in place of a camera, and
       * the network switch drives both at once. Deliberately peer-to-peer in the browser -
       * the app also has a server-backed relay, but that one dies the moment you cut the
       * network, which is exactly when the demo needs the handoff to keep working.
       */
      const params = new URLSearchParams(location.search);
      const ROLES = {
        pilgrim: {
          label: 'Pilgrim',
          who: 'Arjun Sharma · 9000000001',
          origin: 'http://localhost:8081',
          jumps: [['Home', '/(pilgrim)/home'], ['Scan', '/(pilgrim)/scan'], ['History', '/(pilgrim)/history']],
        },
        vendor: {
          label: 'Vendor',
          who: 'Shankar Chai & Snacks · 9000000002',
          origin: 'http://127.0.0.1:8081',
          jumps: [['Dashboard', '/(vendor)/dashboard'], ['Accept', '/(vendor)/accept'], ['Sync', '/(vendor)/sync']],
        },
      };

      const roleKey = (params.get('role') || '').toLowerCase();
      const role = ROLES[roleKey];

      if (!role) {
        document.body.insertAdjacentHTML(
          'beforeend',
          `<div class="hint">
             <h1>Which phone is this window?</h1>
             <p>Open one on each screen. They run on different origins, so they behave as two
                independent handsets — separate wallets, separate offline ledgers.</p>
             <div class="group">
               <button class="primary" onclick="location.search='?role=pilgrim'">Pilgrim phone</button>
               <button class="primary" onclick="location.search='?role=vendor'">Vendor phone</button>
             </div>
           </div>`,
        );
        throw new Error('no role selected');
      }

      const app = document.getElementById('app');
      let origin = params.get('app') || role.origin;

      document.title = `Free Pay — ${role.label}`;
      document.getElementById('brandsub').textContent = role.label + ' phone';
      const roleEl = document.getElementById('role');
      roleEl.textContent = role.label;
      roleEl.className = 'role ' + roleKey;
      document.getElementById('who').textContent = role.who;

      const jumps = document.getElementById('jumps');
      role.jumps.forEach(([label, path]) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.addEventListener('click', () => { app.src = origin + path; });
        jumps.appendChild(b);
      });

      // Origins come from phone-config.json, so a deployment points the two phones at its
      // own hosts without editing this page; ?app= overrides it for one-off use. Loading it
      // is best-effort — the localhost defaults keep working if the file is missing.
      (params.get('app')
        ? Promise.resolve(null)
        : fetch('phone-config.json', { cache: 'no-store' })
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null)
      ).then((cfg) => {
        if (cfg && typeof cfg[roleKey] === 'string' && cfg[roleKey]) origin = cfg[roleKey];
        app.src = origin;
      });

      /* ---------------- scale the phone to the screen ---------------- */
      const wrap = document.querySelector('.stagewrap');
      const inner = document.querySelector('.stageinner');
      const phoneEl = document.querySelector('.phone');
      const CAN_ZOOM = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('zoom', '0.5');
      let fitting = false;
      function fit() {
        if (fitting) return; // measuring resets the zoom, which can re-trigger the observer
        fitting = true;
        try { measureAndScale(); } finally { fitting = false; }
      }
      function measureAndScale() {
        const main = document.querySelector('main');
        // Measure at 1:1 — under `zoom` the reported size already includes the old factor.
        if (CAN_ZOOM) inner.style.zoom = '1';
        const natW = phoneEl.offsetWidth;
        const natH = phoneEl.offsetHeight;
        if (!natW || !natH) return;
        // Never scale past 1:1. A web view upscaled beyond its natural size renders soft
        // text, and at exactly 1:1 no scaling is applied at all — which keeps the phone
        // pixel-crisp and its touch targets honest. We only shrink to fit a small window.
        const k = Math.max(0.25, Math.min(1, (main.clientHeight - 16) / natH, (main.clientWidth - 16) / natW));
        if (k === 1) {
          inner.style.zoom = '';
          inner.style.transform = '';
          wrap.style.width = '';
          wrap.style.height = '';
        } else if (CAN_ZOOM) {
          inner.style.zoom = String(k);
        } else {
          inner.style.transform = 'scale(' + k + ')';
          wrap.style.width = natW * k + 'px';
          wrap.style.height = natH * k + 'px';
        }
      }
      addEventListener('resize', fit);
      new ResizeObserver(fit).observe(document.querySelector('main'));
      fit();

      /* ---------------- toast ---------------- */
      const flashEl = document.getElementById('flash');
      let flashTimer = null;
      function flash(html) {
        flashEl.innerHTML = html;
        flashEl.classList.add('show');
        clearTimeout(flashTimer);
        flashTimer = setTimeout(() => flashEl.classList.remove('show'), 2000);
      }

      /* ---------------- window <-> window bridge ---------------- */
      const channel = new BroadcastChannel('freepay-demo');
      const post = (m) => { try { app.contentWindow && app.contentWindow.postMessage(m, '*'); } catch (_) {} };

      // A code shown while the other phone is on a different screen waits here, and is
      // handed over the moment that phone opens the screen that wants it.
      let pendingQr = null;
      let peerSeenAt = 0;

      // From our own app -> out to the other window.
      addEventListener('message', (event) => {
        const m = event.data;
        if (!m || m.source !== 'freepay') return;
        if (m.kind === 'QR' || m.kind === 'MERCHANT' || m.kind === 'RECEIPT') {
          channel.postMessage({ from: roleKey, msg: m });
        } else if (m.kind === 'HELLO') {
          channel.postMessage({ from: roleKey, msg: m });
        }
      });

      // From the other window -> into our app.
      channel.addEventListener('message', (event) => {
        const d = event.data;
        if (!d || d.from === roleKey) return;
        peerSeenAt = Date.now();
        paintPeer();

        if (d.kind === 'NETWORK') {
          applyNetwork(d.offline, false);
          return;
        }
        const m = d.msg;
        if (!m) return;

        if (m.kind === 'QR') {
          pendingQr = m;
          post(m);
          flash('<span>📷</span> Payment code received <b>from the pilgrim</b>');
        } else if (m.kind === 'MERCHANT') {
          post(m);
          flash('<span>📷</span> Stall code received <b>from the vendor</b>');
        } else if (m.kind === 'RECEIPT') {
          pendingQr = null;
          post(m);
          flash('<span>🧾</span> Signed receipt received <b>from the vendor</b>');
        } else if (m.kind === 'HELLO' && pendingQr && roleKey === 'pilgrim') {
          // The vendor just opened a screen; re-offer the code that is still on our display.
          channel.postMessage({ from: roleKey, msg: pendingQr });
        }
      });

      // Announce ourselves so the other window knows it has a partner.
      setInterval(() => channel.postMessage({ from: roleKey, kind: 'PING' }), 2000);
      channel.postMessage({ from: roleKey, kind: 'PING' });

      const peerEl = document.getElementById('peer');
      function paintPeer() {
        const live = Date.now() - peerSeenAt < 6000;
        peerEl.className = 'peer' + (live ? ' live' : '');
        peerEl.textContent = live
          ? (roleKey === 'pilgrim' ? '● vendor phone connected' : '● pilgrim phone connected')
          : 'waiting for the other phone…';
      }
      setInterval(paintPeer, 2000);
      paintPeer();

      /* ---------------- network switch (drives both windows) ---------------- */
      let offline = false;
      const netBtn = document.getElementById('net');
      const netState = document.getElementById('netstate');

      function applyNetwork(next, announce) {
        offline = next;
        post({ source: 'freepay', kind: 'NETWORK', offline });
        netBtn.textContent = offline ? 'Restore network' : 'Cut the network';
        netBtn.className = offline ? 'primary' : 'danger';
        netState.className = 'netpill' + (offline ? ' offline' : '');
        netState.innerHTML = '<i></i> ' + (offline ? 'Offline' : 'Online');
        if (announce) channel.postMessage({ from: roleKey, kind: 'NETWORK', offline });
        flash(offline ? '<span>📵</span> Network cut — <b>payments still work</b>' : '<span>📶</span> Network restored — <b>auto-sync running</b>');
      }
      netBtn.addEventListener('click', () => applyNetwork(!offline, true));

      /* ---------------- misc controls ---------------- */
      document.getElementById('reload').addEventListener('click', () => { app.src = origin; });
      document.getElementById('bare').addEventListener('click', () => document.body.classList.add('bare'));
      addEventListener('keydown', (e) => {
        if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('bare');
        if (e.key === 'n' || e.key === 'N') applyNetwork(!offline, true);
      });

      // Re-assert the network state to an app that just reloaded.
      app.addEventListener('load', () => setTimeout(() => post({ source: 'freepay', kind: 'NETWORK', offline }), 1200));
    </script>
  </body>
</html>
